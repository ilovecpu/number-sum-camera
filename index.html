<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>실시간 숫자 합계</title>
<style>
:root {
  --fg: #ffffff;
  --muted: rgba(255,255,255,.7);
  --panel: rgba(12,14,20,.78);
  --accent: #ffd23f;
  --box: #3ee07a;
  --off: #ff6b6b;
  --font: -apple-system, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font-family: var(--font); overflow: hidden; }
#stage { position: fixed; inset: 0; }
video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#overlay { pointer-events: none; }

.top {
  position: fixed; left: 0; right: 0; top: 0; z-index: 2;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(var(--panel), transparent);
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  font-size: 13px; color: var(--muted);
}
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.live { background: var(--box); }
.dot.paused { background: var(--accent); }

.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px));
  background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; flex-direction: column; gap: 10px;
}
.sumrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sumrow .lbl { font-size: 13px; color: var(--muted); }
#total { font: 700 clamp(34px, 11vw, 52px) var(--mono); font-variant-numeric: tabular-nums; color: var(--accent); white-space: nowrap; }
#nums { font: 13px var(--mono); color: var(--muted); max-height: 3.2em; overflow-y: auto; overflow-wrap: anywhere; }
.btns { display: flex; gap: 8px; }
button {
  flex: 1; padding: 13px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.08); color: var(--fg); font: 600 15px var(--font); cursor: pointer;
}
button.primary { background: var(--accent); border-color: var(--accent); color: #111; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
label.opt { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }

#start {
  position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  padding: 24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px));
  text-align: center; background: #0d0f14;
}
#start h1 { margin: 0; font-size: 24px; }
#start p { margin: 0; color: var(--muted); max-width: 32ch; line-height: 1.6; }
#start button { flex: none; width: min(320px, 100%); }
#msg { color: var(--off); min-height: 1.4em; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>

<div class="top">
  <span><span class="dot" id="dot"></span><span id="state">준비 중</span></span>
  <label class="opt"><input type="checkbox" id="commaDec"> 쉼표를 소수점으로</label>
</div>

<div class="bottom">
  <div class="sumrow">
    <span class="lbl">합계 · <span id="count">0</span>개</span>
    <span id="total">0.00</span>
  </div>
  <div id="nums">네모 칸 안에 숫자를 비춰 주세요.</div>
  <div class="btns">
    <button id="pause" class="primary" type="button">멈추기</button>
    <button id="copy" type="button">합계 복사</button>
  </div>
</div>

<div id="start">
  <h1>실시간 숫자 합계</h1>
  <p>카메라에 비친 숫자를 계속 읽어서 더합니다. 합계는 소수점 둘째 자리까지 표시해요.</p>
  <button id="go" class="primary" type="button">카메라 켜기</button>
  <div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), octx = overlay.getContext("2d");
const work = document.createElement("canvas"), wctx = work.getContext("2d", { willReadFrequently: true });

let worker = null, paused = false, busy = false;
let lastWords = [];          // [{x,y,w,h,value,on}] in video pixel coords
let history = [];            // recent totals, to smooth flicker

// The scan area is the middle of the frame: full width minus margins, 40% of the height.
function roi(vw, vh) {
  const w = vw * 0.9, h = vh * 0.4;
  return { x: (vw - w) / 2, y: (vh - h) / 2, w, h };
}

function parseNumbers(text, commaIsDecimal) {
  const out = [];
  const re = commaIsDecimal
    ? /[-−]?\d{1,3}(?:\.\d{3})+(?:,\d+)?|[-−]?\d+(?:,\d+)?/g
    : /[-−]?\d{1,3}(?:,\d{3})+(?:\.\d+)?|[-−]?\d+(?:\.\d+)?/g;
  for (const m of text.matchAll(re)) {
    let s = m[0].replace("−", "-");
    s = commaIsDecimal ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
    const v = Number(s);
    if (isFinite(v)) out.push({ raw: m[0], value: v });
  }
  return out;
}

// Add in scaled integers so 0.1 + 0.2 is exactly 0.30, then round to 2 places.
function sumOf(vals) {
  if (!vals.length) return 0;
  const dec = Math.min(8, Math.max(0, ...vals.map(v => (String(v).split(".")[1] || "").length)));
  const k = 10 ** dec;
  const s = vals.reduce((a, v) => a + Math.round(v * k), 0) / k;
  return Math.sign(s) * Math.round(Math.abs(s) * 100 + 1e-9) / 100;
}
const fmt = (n) => n.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function setState(text, cls) {
  $("state").textContent = text;
  $("dot").className = "dot" + (cls ? " " + cls : "");
}

// Map a point in video pixels to the on-screen canvas, matching object-fit: cover.
function mapper() {
  const cw = overlay.clientWidth, ch = overlay.clientHeight;
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(cw / vw, ch / vh);
  const ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  return { s, ox, oy, cw, ch };
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const { s, ox, oy, cw, ch } = mapper();
  if (overlay.width !== cw * dpr) { overlay.width = cw * dpr; overlay.height = ch * dpr; }
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, cw, ch);
  if (!video.videoWidth) return;
  const r = roi(video.videoWidth, video.videoHeight);
  // Dim outside the scan area.
  octx.fillStyle = "rgba(0,0,0,.35)";
  octx.fillRect(0, 0, cw, ch);
  octx.clearRect(ox + r.x * s, oy + r.y * s, r.w * s, r.h * s);
  octx.strokeStyle = paused ? "#ffd23f" : "rgba(255,255,255,.9)";
  octx.lineWidth = 2;
  octx.strokeRect(ox + r.x * s, oy + r.y * s, r.w * s, r.h * s);
  octx.font = "600 14px ui-monospace, Menlo, monospace";
  for (const w of lastWords) {
    const x = ox + w.x * s, y = oy + w.y * s;
    octx.strokeStyle = "#3ee07a"; octx.lineWidth = 2;
    octx.strokeRect(x, y, w.w * s, w.h * s);
    const label = String(w.value);
    const tw = octx.measureText(label).width + 8;
    octx.fillStyle = "#3ee07a";
    octx.fillRect(x, y - 18, tw, 18);
    octx.fillStyle = "#000";
    octx.fillText(label, x + 4, y - 4);
  }
}

function showResult(found) {
  lastWords = found;
  const vals = found.map(f => f.value);
  const t = sumOf(vals);
  history.push(t); if (history.length > 3) history.shift();
  // Show the total only once it repeats, so one misread frame doesn't flash a wrong sum.
  const stable = history.filter(h => h === t).length >= 2 || history.length < 2;
  if (stable) {
    $("total").textContent = fmt(t);
    $("count").textContent = vals.length;
    $("nums").textContent = vals.length ? vals.map(v => v.toLocaleString("ko-KR", { maximumFractionDigits: 6 })).join(" + ") : "네모 칸 안에 숫자를 비춰 주세요.";
  }
}

async function tick() {
  if (paused || busy || !worker || !video.videoWidth) return;
  busy = true;
  try {
    const vw = video.videoWidth, vh = video.videoHeight, r = roi(vw, vh);
    const scale = Math.min(1, 1200 / r.w);
    work.width = Math.round(r.w * scale); work.height = Math.round(r.h * scale);
    wctx.filter = "grayscale(1) contrast(1.6)";
    wctx.drawImage(video, r.x, r.y, r.w, r.h, 0, 0, work.width, work.height);
    const { data } = await worker.recognize(work);
    if (paused) return;
    const comma = $("commaDec").checked;
    const found = [];
    for (const w of data.words || []) {
      if (w.confidence < 55) continue;
      for (const n of parseNumbers(w.text, comma)) {
        found.push({
          value: n.value,
          x: r.x + w.bbox.x0 / scale, y: r.y + w.bbox.y0 / scale,
          w: (w.bbox.x1 - w.bbox.x0) / scale, h: (w.bbox.y1 - w.bbox.y0) / scale,
        });
      }
    }
    showResult(found);
  } catch (e) {
    console.error(e);
  } finally {
    busy = false;
  }
}

function loop() {
  draw();
  tick();
  requestAnimationFrame(loop);
}

async function start() {
  $("msg").textContent = "";
  $("go").disabled = true;
  $("go").textContent = "켜는 중…";
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("insecure");
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    $("go").disabled = false; $("go").textContent = "카메라 켜기";
    $("msg").textContent = e.message === "insecure"
      ? "카메라는 https:// 주소에서만 켤 수 있어요."
      : "카메라를 켤 수 없어요. 브라우저 설정에서 카메라를 허용해 주세요.";
    return;
  }
  $("start").hidden = true;
  setState("글자 인식 준비 중 (처음 한 번 몇 초)");
  requestAnimationFrame(loop);
  try {
    worker = await Tesseract.createWorker("eng");
    await worker.setParameters({
      tessedit_char_whitelist: "0123456789.,-",
      tessedit_pageseg_mode: "11",
    });
    setState("읽는 중", "live");
  } catch (e) {
    console.error(e);
    setState("글자 인식을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침하세요.");
  }
}

$("go").onclick = start;
$("pause").onclick = () => {
  paused = !paused;
  $("pause").textContent = paused ? "다시 읽기" : "멈추기";
  if (paused) { video.pause(); setState("멈춤 · 합계 고정", "paused"); }
  else { video.play(); history = []; setState("읽는 중", "live"); }
};
$("copy").onclick = async () => {
  const text = $("total").textContent.replace(/,/g, "");
  try { await navigator.clipboard.writeText(text); $("copy").textContent = "복사했어요"; }
  catch { $("copy").textContent = text; }
  setTimeout(() => { $("copy").textContent = "합계 복사"; }, 1800);
};
$("commaDec").onchange = () => { history = []; };
</script>
</body>
</html>
